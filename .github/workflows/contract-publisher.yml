name: Publish OpenAPI Contract

on:
  push:
    branches: [ main, master ]

jobs:
  publish-contract:
    runs-on: ubuntu-latest

    # Configura um serviço de PostgreSQL rodando na máquina virtual do GitHub Actions
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: minierp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositório Backend
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar e Testar Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/minierp
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          chmod +x ./mvnw
          ./mvnw clean test

      - name: Iniciar Spring Boot em background
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/minierp
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          chmod +x ./mvnw
          ./mvnw spring-boot:run &
          sleep 15

      - name: Baixar o JSON do OpenAPI
        run: |
          curl -s http://localhost:8080/v3/api-docs > openapi.json
          cat openapi.json

      - name: Enviar contrato para a pasta contracts do repositório mini-erp-doc
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@minierp.local"
          
          git clone https://x-access-token:${DOCS_TOKEN}@github.com/Psykdragonblad/mini-erp-docs.git temp-docs
          
          mkdir -p temp-docs/contracts
          cp openapi.json temp-docs/contracts/openapi.json
          
          cd temp-docs
          
          # Adiciona o arquivo para que o git passe a rastreá-lo
          git add contracts/openapi.json
          
          # Verifica se há mudanças (seja arquivo novo ou modificado)
          if git diff --staged --quiet; then
            echo "O contrato OpenAPI não sofreu alterações."
          else
            git commit -m "chore: atualiza contrato openapi via CI do backend [skip ci]"
            git push origin main
            echo "Contrato atualizado com sucesso no mini-erp-docs!"
          fi